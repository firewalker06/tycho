# Tycho hooks configuration.
#
# Tycho copies this file to ~/.tycho/config/hooks.yml on first setup. It is
# intentionally inert so a new install never runs user shell commands until you
# opt in. Uncomment and adapt examples before use.
#
# Payload reaches hooks via:
#   - stdin: JSON-encoded payload
#   - env: TYCHO_EVENT, TYCHO_PROJECT_KEY, TYCHO_AGENT_KEY, TYCHO_BIN,
#          TYCHO_PROJECT_PATH, plus any `env:` keys below
# The `command` is never interpolated with payload data; use stdin/env instead.

hooks: {}

